## Install LANDIS-II v8 natively on Windows and record what got installed.
##
## WHY THIS EXISTS
##
## The reproduction race fixed in #26 only occurs when a succession extension
## runs reproduction on more than one thread, and PnET-Succession is the only
## extension that sets `ThreadCount` (it reads a `Parallel` parameter and
## assigns it; NECN and Biomass Succession never touch it, so they always
## reproduce serially). That makes the fix untestable in the Linux docker
## images: the UCLv2 image carries Succession-v10 but ships no PnET, while the
## image that ships PnET carries Succession-v9. There is no container in which
## this library and PnET coexist.
##
## A native Windows install is the only configuration where they do, and it is
## also what users actually run, so it is where a report of "different results
## with the new DLL" has to be reproduced.
##
## WHAT THIS JOB DOES, AND DOES NOT, DO YET
##
## It installs and inventories; it does not yet run the model. Whether a
## parallel comparison is even possible depends on something only the install
## can answer: whether the PUBLISHED PnET installer binds Succession-v10 or
## Succession-v9. If it binds v9, swapping a v10 DLL changes nothing and any
## observed difference was never attributable to the DLL. Writing the run
## matrix before knowing that risks building a harness that cannot work.
##
## Opt-in: the install is a Core MSI plus ~20 Inno Setup extension installers
## and takes 5-15 minutes, too slow to attach to every push. It runs on manual
## dispatch, or when a commit subject contains `[ci-windows]`. The sentinel is
## matched against the FIRST LINE only, so describing the trigger in a commit
## body cannot accidentally fire the job. (`workflow_dispatch` alone would not
## do: GitHub only exposes it once the workflow is on the default branch, which
## makes it useless while the workflow is still being developed on a branch.)

name: integration-windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      extensions_yaml:
        description: 'Tool-Docker-Apptainer extension list to install'
        type: choice
        default: extensions-v8-UCL2-release.yaml
        options:
          - extensions-v8-UCL2-release.yaml
          - extensions-v8-release.yaml
      reps:
        description: 'Runs per matrix cell (2 detects gross non-determinism; more is needed to call a cell reproducible)'
        type: string
        default: '2'
      threads:
        description: 'Thread count for the parallel cells'
        type: string
        default: '4'

permissions: read-all

env:
  ## The install helper is reused from landisutils rather than vendored: it is
  ## ~880 lines that silently-install an MSI and a score of Inno Setup
  ## packages, discover where they landed, and then MEASURE which cohort
  ## library generation each installed extension binds. That measurement is the
  ## whole value here, and duplicating it would mean duplicating its bug
  ## history. Pinned to a commit so this workflow does not change underneath
  ## itself. For an upstream PR it should be vendored or published properly;
  ## a cross-repo raw fetch is acceptable for a diagnostic, not as a dependency.
  LANDISUTILS_REPO: FOR-CAST/landisutils
  LANDISUTILS_REF: c85f1b6ac813bd4e4e7496bcfe5d24dd1290b11c

  ## The PnET scenario and the extension list are read from the SAME
  ## Tool-Docker-Apptainer commit, so the inputs and the installed extension
  ## set cannot drift apart. This is the ref landisutils pins, where the UCLv2
  ## list includes PnET-Succession.
  TDA_REPO: LANDIS-II-Foundation/Tool-Docker-Apptainer
  TDA_REF: 043b43e6291813d5092721d45ff630502e777e30

  ## The candidate half of the matrix is built from this ref, fetched from
  ## upstream, so its provenance is the pull request itself.
  PR_REF: pull/26/head

jobs:
  ## Cheap Linux job that decides whether the expensive Windows job runs, so an
  ## ordinary push costs seconds rather than a quarter of an hour.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      extensions_yaml: ${{ steps.decide.outputs.extensions_yaml }}
      reps: ${{ steps.decide.outputs.reps }}
      threads: ${{ steps.decide.outputs.threads }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          MSG_PUSH: ${{ github.event.head_commit.message }}
          MSG_PR: ${{ github.event.pull_request.title }}
          INPUT_YAML: ${{ github.event.inputs.extensions_yaml }}
          INPUT_REPS: ${{ github.event.inputs.reps }}
          INPUT_THREADS: ${{ github.event.inputs.threads }}
        run: |
          should_run=false
          ## First line only: a commit body that merely mentions the sentinel
          ## must not trigger a 15-minute install.
          subject_push=$(printf '%s\n' "$MSG_PUSH" | head -n1)
          subject_pr=$(printf '%s\n' "$MSG_PR" | head -n1)
          case "$EVENT" in
            workflow_dispatch)
              should_run=true ;;
            push)
              [[ "$subject_push" == *"[ci-windows]"* ]] && should_run=true ;;
            pull_request)
              [[ "$subject_pr" == *"[ci-windows]"* ]] && should_run=true ;;
          esac

          ## `inputs` exists only for workflow_dispatch, so a push needs defaults.
          yaml="${INPUT_YAML:-extensions-v8-UCL2-release.yaml}"
          reps="${INPUT_REPS:-2}"
          threads="${INPUT_THREADS:-4}"

          ## Guard against a non-numeric dispatch input reaching PowerShell as
          ## a bare argument, where it would be a confusing parse error.
          [[ "$reps"    =~ ^[0-9]+$ ]] || { echo "::error::reps must be an integer, got '$reps'"; exit 1; }
          [[ "$threads" =~ ^[0-9]+$ ]] || { echo "::error::threads must be an integer, got '$threads'"; exit 1; }

          echo "run=$should_run" >> "$GITHUB_OUTPUT"
          echo "extensions_yaml=$yaml" >> "$GITHUB_OUTPUT"
          echo "reps=$reps" >> "$GITHUB_OUTPUT"
          echo "threads=$threads" >> "$GITHUB_OUTPUT"
          echo "Gate: event=$EVENT run=$should_run yaml=$yaml reps=$reps threads=$threads"
          echo "  push subject: $subject_push"

  install-and-inventory:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: LANDIS-II v8 native install + binary inventory
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      ## The helper needs only gh and cli; it is not part of the landisutils
      ## package proper. P3M serves Windows binaries, so this is seconds.
      - name: Install R dependencies
        run: |
          install.packages(c('gh', 'cli'), repos = 'https://packagemanager.posit.co/cran/latest')
        shell: Rscript {0}

      ## _pins.R must sit beside the installer: the script sources it from its
      ## own directory to resolve the Core MSI URL and the Tool-Docker-Apptainer
      ## ref that supplies the extension list.
      - name: Fetch the install helper
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'landis-install'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://raw.githubusercontent.com/$env:LANDISUTILS_REPO/$env:LANDISUTILS_REF/inst/integration-tests"
          foreach ($f in 'install_landis_windows.R', '_pins.R') {
            $dest = Join-Path $dir $f
            Invoke-WebRequest -Uri "$base/$f" -OutFile $dest
            if (-not ((Test-Path -LiteralPath $dest) -and (Get-Item -LiteralPath $dest).Length -gt 0)) {
              Write-Host "::error::failed to fetch $f"
              exit 1
            }
            '{0,10} bytes  {1}' -f (Get-Item -LiteralPath $dest).Length, $f | Write-Host
          }
          "LANDIS_INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache LANDIS-II installers
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\landis-installers
          key: landis-installers-${{ env.LANDISUTILS_REF }}-${{ needs.gate.outputs.extensions_yaml }}

      ## Exports LANDIS_CONSOLE_DLL and LANDIS_EXCLUDE_EXTENSIONS to GITHUB_ENV.
      ## Individual extension install failures warn rather than fail, so a
      ## partial install still yields an inventory, which is the point.
      - name: Install LANDIS-II v8 (Core MSI + extension installers)
        env:
          LANDIS_EXTENSIONS_YAML: ${{ needs.gate.outputs.extensions_yaml }}
          LANDIS_TARGET_COHORT_GENERATION: '2'
          LANDIS_DOWNLOAD_DIR: ${{ runner.temp }}\landis-installers
          ## The helper resolves each extension's installer through the GitHub
          ## releases API. Unauthenticated, that is rate-limited per hour, and
          ## the helper treats a failed lookup as "no V8 installer found" with a
          ## warning rather than an error. Two runs eight minutes apart with
          ## identical inputs therefore installed 20 and then only 8 of 20
          ## extensions. Authenticating removes the cliff; the check below
          ## refuses to proceed if it degrades anyway.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'landis-install.log'
          Rscript "$env:LANDIS_INSTALL_DIR\install_landis_windows.R" 2>&1 |
            Tee-Object -FilePath $log
          "LANDIS_INSTALL_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append

      ## A silently partial install is worse than a failed one: the scenario
      ## then runs without extensions it needed, or dies on a confusing parse
      ## error far from the cause. Fail here instead.
      - name: Verify the install is complete
        run: |
          $log = Get-Content -LiteralPath $env:LANDIS_INSTALL_LOG -Raw
          $m = [regex]::Match($log, 'Done:\s*(\d+)\s*installed,\s*(\d+)\s*failed,\s*(\d+)\s*no-installer')
          if (-not $m.Success) {
            Write-Host "::error::could not find the install summary in the helper output"
            exit 1
          }
          $installed = [int]$m.Groups[1].Value
          $failed    = [int]$m.Groups[2].Value
          $missing   = [int]$m.Groups[3].Value
          Write-Host "installed=$installed failed=$failed no-installer=$missing"

          $bad = $false
          if ($failed -gt 0)  { Write-Host "::error::$failed extension installer(s) failed"; $bad = $true }
          if ($missing -gt 0) {
            Write-Host "::error::$missing extension(s) had no installer resolved. With GITHUB_PAT set this indicates a genuine packaging gap, not API rate limiting -- check the helper's lookup for those repos."
            $bad = $true
          }
          if ($bad) { exit 1 }

      ## ----------------------------------------------------------------------
      ## Downgrade PnET-Succession to v6.1.
      ##
      ## The install helper takes the NEWEST published installer for each repo,
      ## which is PnET-Succession v6.1.1 (released 2026-09-12). That release
      ## calls `PnETCohorts.SiteVars.UpdateUniversalCohorts()`, added to
      ## Extension-PnET-Succession on 2026-09-11, and the method exists only on
      ## Library-PnET-Cohort's master branch -- a repository with no releases at
      ## all, so no published build carries it. The result is that a fresh
      ## install of the current PnET-Succession cannot load:
      ##
      ##   Method not found: 'Void Landis.Library.PnETCohorts.SiteVars.UpdateUniversalCohorts()'
      ##      at Landis.Extension.Succession.BiomassPnET.PlugIn.Initialize()
      ##
      ## Verified here with nothing swapped, so it is not caused by anything
      ## this workflow builds. v6.1 (2026-07-14) predates that call and matches
      ## the PnETCohorts that is actually in circulation, so it is the newest
      ## combination a user can really obtain. Remove this step once upstream
      ## releases a PnET-Cohorts carrying the method.
      ## ----------------------------------------------------------------------
      - name: Downgrade PnET-Succession to v6.1 (v6.1.1 cannot load)
        run: |
          $url = 'https://github.com/LANDIS-II-Foundation/Extension-PnET-Succession/releases/download/v6.1/LANDIS-II-V8.PnET-Succession.6.1-setup.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'pnet-6.1-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          '{0,10} bytes  {1}' -f (Get-Item -LiteralPath $exe).Length, (Split-Path -Leaf $exe) | Write-Host

          $log = Join-Path $env:RUNNER_TEMP 'landis-installers\pnet-6.1-install.log'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $log) | Out-Null
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log"
          )
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::PnET-Succession v6.1 installer exited $($p.ExitCode)"
            exit 1
          }

          $consoleDir  = Split-Path -Parent $env:LANDIS_CONSOLE_DLL
          $installRoot = Split-Path -Parent $consoleDir
          $pnet = Get-ChildItem -LiteralPath $installRoot -Recurse -File `
                                -Filter 'Landis.Extension.Succession.BiomassPnET-v6.dll' |
                  Select-Object -First 1
          if (-not $pnet) {
            Write-Host "::error::PnET assembly missing after the downgrade"
            exit 1
          }
          'PnET-Succession now: FileVersion {0}' -f $pnet.VersionInfo.FileVersion | Write-Host
          if ($pnet.VersionInfo.FileVersion -eq '6.1.1') {
            Write-Host "::error::still 6.1.1; the downgrade did not take effect"
            exit 1
          }

      - name: Verify the console was found
        run: |
          if (-not $env:LANDIS_CONSOLE_DLL) {
            Write-Host "::error::LANDIS_CONSOLE_DLL not set; the install step did not find a console."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:LANDIS_CONSOLE_DLL)) {
            Write-Host "::error::LANDIS_CONSOLE_DLL points at a missing file: $env:LANDIS_CONSOLE_DLL"
            exit 1
          }
          Write-Host "LANDIS_CONSOLE_DLL = $env:LANDIS_CONSOLE_DLL"
          Write-Host "LANDIS_EXCLUDE_EXTENSIONS = $env:LANDIS_EXCLUDE_EXTENSIONS"

      ## Inventory both the console directory and the extensions directory
      ## beside it. This is the artifact that makes a future bug report
      ## answerable: AssemblyVersion is pinned at 10.0 for this library, so only
      ## ProductVersion (InformationalVersion + source commit) and the hash can
      ## identify which build was loaded.
      ## Recurse from the install ROOT, not the console directory. The extension
      ## assemblies do not sit beside the console: a first attempt scanned only
      ## the console directory plus an assumed `extensions` subdirectory, found
      ## 27 core assemblies and no succession libraries at all, and reported
      ## success. The install itself had been fine.
      - name: Inventory the installed binaries
        run: |
          $consoleDir  = Split-Path -Parent $env:LANDIS_CONSOLE_DLL
          $installRoot = Split-Path -Parent $consoleDir
          Write-Host "console dir : $consoleDir"
          Write-Host "install root: $installRoot"
          Write-Host "directories containing assemblies:"
          Get-ChildItem -LiteralPath $installRoot -Filter *.dll -File -Recurse |
            Group-Object DirectoryName |
            Sort-Object Name |
            ForEach-Object { '  {0,5} dll  {1}' -f $_.Count, $_.Name | Write-Host }
          ./tools/dll-inventory.ps1 $installRoot -Recurse -OutFile 'inventory/windows-install.csv'

      ## The gating question for a parallel test. PnET is the only succession
      ## extension that sets ThreadCount, so if its installed binary binds
      ## Succession-v9 then replacing Succession-v10 cannot affect any PnET run
      ## and the whole comparison is void.
      - name: Report which Succession library PnET binds
        run: |
          $consoleDir  = Split-Path -Parent $env:LANDIS_CONSOLE_DLL
          $installRoot = Split-Path -Parent $consoleDir
          $pnet = Get-ChildItem -LiteralPath $installRoot -Recurse -Filter '*.dll' -File |
                  Where-Object { $_.Name -match 'Succession\.BiomassPnET|PnET-Succession' }
          ## Fail rather than warn. The install step reports how many extensions
          ## it installed and which generation each binds, so "PnET is missing"
          ## here after a clean install means this step is looking in the wrong
          ## place -- which is exactly what happened, and warning let the job go
          ## green while establishing nothing.
          if (-not $pnet) {
            Write-Host "::error::no PnET-Succession assembly found under $installRoot, yet the install step reported success; this check is looking in the wrong place"
            exit 1
          }
          foreach ($p in $pnet) {
            Write-Host "== $($p.Name)"
            try {
              $refs = [System.Reflection.Assembly]::LoadFrom($p.FullName).GetReferencedAssemblies() |
                      Where-Object { $_.Name -match 'Succession|UniversalCohorts|PnETCohorts' }
              foreach ($r in $refs) { Write-Host ("   ref -> {0}, Version={1}" -f $r.Name, $r.Version) }
              if ($refs.Name -contains 'Landis.Library.Succession-v10') {
                Write-Host "::notice::PnET binds Succession-v10; a parallel reproduction test IS possible from this install"
              } else {
                Write-Host "::warning::PnET does not bind Succession-v10; swapping that DLL cannot affect a PnET run"
              }
            } catch {
              Write-Host "::warning::could not read references from $($p.Name): $($_.Exception.GetType().Name)"
            }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-install-inventory
          path: inventory/windows-install.csv
          if-no-files-found: warn
          retention-days: 14

      ## ----------------------------------------------------------------------
      ## Reproduction run matrix.
      ##
      ## Both libraries are built here, in one job, from one checkout. That is
      ## the point: an earlier attempt compared a locally built candidate
      ## against the library shipping in Support-Library-Dlls-v8, which is a
      ## Debug build linked against a different UniversalCohorts version, so the
      ## comparison varied three things at once and established nothing. Here
      ## the only difference between the two halves is the four files PR #26
      ## touches.
      ## ----------------------------------------------------------------------

      ## `src/lib/*.dll` is git-ignored, so a fresh checkout cannot compile until
      ## these are fetched. Forgetting this step is exactly how the first attempt
      ## at the matrix failed, with a CS0234 about a missing namespace rather
      ## than anything mentioning the support libraries.
      ##
      ## Two sources, deliberately. `UniversalCohorts-v2` is taken from the
      ## INSTALL on this runner, because the version a library is compiled
      ## against has to match the one it will be loaded against: a build linked
      ## to 2.0.1.0 hard-fails on an install carrying 1.3.0.0, and the repo's own
      ## download script pulls from a moving branch, so it cannot be relied on
      ## to agree with whatever the installers just put on disk. `Seed_Dispersal`
      ## is not shipped by the installers at all, so it comes from the script;
      ## that is survivable because .NET resolves assemblies lazily and the Ward
      ## dispersal path this scenario uses never touches those types.
      - name: Stage the support libraries the build needs
        run: |
          Push-Location src/lib
          try { ./support_libs_download.ps1 } finally { Pop-Location }

          $consoleDir  = Split-Path -Parent $env:LANDIS_CONSOLE_DLL
          $installRoot = Split-Path -Parent $consoleDir
          $installed = Get-ChildItem -LiteralPath $installRoot -Recurse -File `
                                     -Filter 'Landis.Library.UniversalCohorts-v2.dll' |
                       Select-Object -First 1
          if (-not $installed) {
            Write-Host "::error::no UniversalCohorts-v2 in the install; cannot guarantee the build matches what it will run against"
            exit 1
          }
          Copy-Item -Force -LiteralPath $installed.FullName -Destination 'src/lib/Landis.Library.UniversalCohorts-v2.dll'

          foreach ($n in 'Landis.Library.UniversalCohorts-v2.dll', 'Seed_Dispersal.dll') {
            $p = Join-Path 'src/lib' $n
            if (-not ((Test-Path -LiteralPath $p) -and (Get-Item -LiteralPath $p).Length -gt 0)) {
              Write-Host "::error::missing or empty: $p"
              exit 1
            }
            $i = Get-Item -LiteralPath $p
            $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.Substring(0,16).ToLower()
            $src = ($n -like 'Landis.Library.UniversalCohorts-v2*') ? 'from the install' : 'from the download script'
            '{0,-42} {1,7} bytes  {2}  {3}' -f $n, $i.Length, $h, $src | Write-Host
          }

      - name: Build the baseline library (this checkout)
        run: |
          dotnet build src/library-succession.csproj -c Release `
            -p:OutputPath=${{ runner.temp }}/lib-baseline/ `
            -p:ContinuousIntegrationBuild=true
          Get-Item "${{ runner.temp }}/lib-baseline/Landis.Library.Succession-v10.dll" |
            ForEach-Object { 'baseline : {0,7} bytes  FileVersion {1}' -f $_.Length, $_.VersionInfo.FileVersion } |
            Write-Host

      ## Swap in only the files the PR changes, build, then put the tree back.
      - name: Build the candidate library (upstream PR sources)
        run: |
          git remote add upstream "https://github.com/$env:TDA_PR_SOURCE_REPO.git" 2>$null
          git fetch --quiet upstream "$env:PR_REF"
          $sha = (git rev-parse FETCH_HEAD).Trim()
          Write-Host "candidate sources: $env:PR_REF -> $sha"
          "PR26_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

          $files = @('src/Reproduction.cs', 'src/Seeding.cs',
                     'src/WardSeedDispersal.cs', 'src/library-succession.csproj')
          git checkout FETCH_HEAD -- $files
          Write-Host "files taken from the PR:"
          git diff --stat HEAD -- $files

          dotnet build src/library-succession.csproj -c Release `
            -p:OutputPath=${{ runner.temp }}/lib-fixed/ `
            -p:ContinuousIntegrationBuild=true
          Get-Item "${{ runner.temp }}/lib-fixed/Landis.Library.Succession-v10.dll" |
            ForEach-Object { 'candidate: {0,7} bytes  FileVersion {1}' -f $_.Length, $_.VersionInfo.FileVersion } |
            Write-Host

          ## Restore, so later steps see the branch as checked out.
          git checkout HEAD -- $files
        env:
          TDA_PR_SOURCE_REPO: LANDIS-II-Foundation/Library-Succession

      ## Scenario and extension list come from the SAME Tool-Docker-Apptainer
      ## commit, so inputs and installed extensions cannot drift apart.
      ## Extracted somewhere that is never run in: this scenario rewrites its
      ## own harvest inputs (Magic Harvest launches a script that renames them),
      ## so a tree that has been run in is no longer pristine.
      ## The zip, not the tarball. The runner resolves `tar` to MSYS GNU tar,
      ## which reads a Windows path as a remote host spec and dies with
      ## "Cannot connect to D: resolve failed". Expand-Archive has no such
      ## problem and needs no external tool.
      ## The scenario and the extension list come from Tool-Docker-Apptainer, but
      ## through two INDEPENDENT pins: this workflow's TDA_REF drives the
      ## scenario fetch below, while the install helper sources its own TDA_REF
      ## from landisutils' _pins.R. Point one at a different commit and the
      ## scenario can reference extensions the install never provided.
      ##
      ## That is not hypothetical: pointing TDA_REF at a newer branch to test a
      ## scenario change produced `No extension with the name "Climate BDA"` --
      ## the newer scenario activates it, the pinned extension list has it
      ## commented out -- and that read as a bug in the scenario rather than as
      ## a mismatch I had introduced. Fail here instead, where the cause is
      ## obvious.
      - name: Check the scenario and extension-list refs agree
        run: |
          $pins = Get-Content -LiteralPath "$env:LANDIS_INSTALL_DIR\_pins.R" -Raw
          $m = [regex]::Match($pins, 'TDA_REF\s*<-\s*"([0-9a-f]{7,40})"')
          if (-not $m.Success) {
            Write-Host "::error::could not read TDA_REF out of the install helper's _pins.R"
            exit 1
          }
          $helperRef = $m.Groups[1].Value
          Write-Host "extension list ref (helper _pins.R): $helperRef"
          Write-Host "scenario ref       (this workflow): $env:TDA_REF"

          if ($helperRef -ne $env:TDA_REF) {
            Write-Host ("::error::the scenario is being taken from $env:TDA_REF but the extensions " +
                        "were installed from $helperRef. The scenario may reference extensions that " +
                        "are not installed. Point both at the same commit, or bump _pins.R in landisutils.")
            exit 1
          }
          Write-Host "both refs agree, so the scenario and the installed extension set are consistent"

      - name: Fetch the PnET scenario
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'tda.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'tda'
          Invoke-WebRequest -Uri "https://codeload.github.com/$env:TDA_REPO/zip/$env:TDA_REF" -OutFile $zip
          if (Test-Path -LiteralPath $dst) { Remove-Item -Recurse -Force -LiteralPath $dst }
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force

          ## GitHub's zip wraps everything in <repo>-<ref>; find it rather than
          ## assuming the name.
          $top = @(Get-ChildItem -LiteralPath $dst -Directory)
          if ($top.Count -ne 1) {
            Write-Host "::error::expected one top-level directory in the archive, found $($top.Count)"
            exit 1
          }
          $scen = Join-Path $top[0].FullName 'tests/TestPnET_AllExtension'
          if (-not (Test-Path -LiteralPath (Join-Path $scen 'scenario_UCLv2.txt'))) {
            Write-Host "::error::scenario_UCLv2.txt not found under $scen"
            exit 1
          }
          '{0} input files staged' -f @(Get-ChildItem -LiteralPath $scen -Recurse -File).Count | Write-Host
          Write-Host "pristine scenario: $scen"
          "PRISTINE_SCENARIO=$scen" | Out-File -FilePath $env:GITHUB_ENV -Append

      ## Magic Harvest shells out to `python`. If it is missing the run dies
      ## mid-scenario, which reads like a model failure rather than a missing
      ## dependency.
      - name: Check python is on PATH (Magic Harvest launches it)
        run: |
          $v = (& python --version 2>&1) -join ' '
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::python is not on PATH; Magic Harvest cannot launch switchManagementNames.py"
            exit 1
          }
          Write-Host "python: $v"

      - name: Run the reproduction matrix
        run: |
          ./tools/run-pnet-matrix.ps1 `
            -ConsoleDll "$env:LANDIS_CONSOLE_DLL" `
            -PristineScenario "$env:PRISTINE_SCENARIO" `
            -BaselineDll "${{ runner.temp }}/lib-baseline/Landis.Library.Succession-v10.dll" `
            -FixedDll "${{ runner.temp }}/lib-fixed/Landis.Library.Succession-v10.dll" `
            -WorkRoot "${{ runner.temp }}/matrix" `
            -Reps ${{ needs.gate.outputs.reps }} `
            -Threads ${{ needs.gate.outputs.threads }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-matrix-results
          path: |
            ${{ runner.temp }}/matrix/matrix-results.json
            ${{ runner.temp }}/matrix/*.log
          if-no-files-found: warn
          retention-days: 14

      ## msiexec and Inno Setup write verbose logs beside the downloads. Without
      ## these an install failure leaves nothing to explain it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer-logs
          path: ${{ runner.temp }}/landis-installers/*.log
          if-no-files-found: ignore
          retention-days: 14
